<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contact-container">
        <h2>New Message</h2>
        <p class="subtitle">Compose your organization contact request below.</p>
        
        <div id="successAlert" class="success-alert">
            <strong>Success!</strong> Your message has been sent successfully.
        </div>

        <form id="contactForm">
            <div class="form-group">
                <label for="senderName">Your Name</label>
                <input type="text" id="senderName" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="senderEmail">Your Email</label>
                <input type="email" id="senderEmail" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="Regarding partnership opportunities..." required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="6" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" class="send-btn">
                <span>Send Message</span>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
